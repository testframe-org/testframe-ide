name: CI

# The IDE compiles against its sibling folders in the superproject (testframe-org/testframe):
# modules/jsonassert (the jsonassert-js engine) and modules/testframe-tour-ui (the tour screens).
# The `ide` job therefore checks out the superproject and puts this repository's commit in place of
# its modules/testframe-ide submodule. The full stack (plugin, smoke, format parity) runs in the
# superproject's CI.
#
# Requires the repository secret SUPERPROJECT_TOKEN: a fine-grained PAT with read-only "Contents"
# access to testframe-org/testframe and its private submodule testframe-org/testframe-tour-ui. The
# jsonassert submodule is public.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ide:
    name: IDE (test + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the superproject
        uses: actions/checkout@v4
        with:
          repository: testframe-org/testframe
          token: ${{ secrets.SUPERPROJECT_TOKEN }}
          persist-credentials: false
      - name: Checkout the sibling submodules (jsonassert, tour UI)
        env:
          SUPERPROJECT_TOKEN: ${{ secrets.SUPERPROJECT_TOKEN }}
        run: |
          # Private testframe-org submodules use the PAT; public ones (jsonassert) go anonymous.
          git config --global url."https://x-access-token:${SUPERPROJECT_TOKEN}@github.com/testframe-org/".insteadOf "git@github.com:testframe-org/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1 modules/jsonassert modules/testframe-tour-ui
      - name: Checkout this commit as modules/testframe-ide
        uses: actions/checkout@v4
        with:
          path: modules/testframe-ide
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: |
          (cd modules/jsonassert/modules/jsonassert-js && bun install --frozen-lockfile)
          (cd modules/testframe-tour-ui && bun install --frozen-lockfile)
          (cd modules/testframe-ide && bun install --frozen-lockfile)
      - name: Test
        working-directory: modules/testframe-ide
        run: bun test
      - name: Typecheck
        working-directory: modules/testframe-ide
        run: bun run typecheck
      - name: Build
        working-directory: modules/testframe-ide
        run: bun run build

  product-api:
    name: example product-api (Spring Boot + Mongo)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test
        working-directory: examples/product-test/examples-components/product-api
        run: ./mvnw -B -q verify

  product-web:
    name: example product-web (Vite React TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: examples/product-test/examples-components/product-web
        run: bun install --frozen-lockfile
      - name: Typecheck + build
        working-directory: examples/product-test/examples-components/product-web
        run: bun run build

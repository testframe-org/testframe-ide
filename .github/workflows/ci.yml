name: CI

# The IDE compiles against two sibling folders of the superproject layout: modules/jsonassert (the
# jsonassert-js engine) and modules/testframe-tour-ui (the tour screens), both public repos. The
# `ide` job rebuilds that layout from them — this commit at modules/testframe-ide, the siblings at
# their default branch — so it needs no secret and never reads the private superproject. The full
# stack (plugin, smoke, format parity, the pinned submodule commits) runs in the superproject's CI.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ide:
    name: IDE (test + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this commit as modules/testframe-ide
        uses: actions/checkout@v4
        with:
          path: modules/testframe-ide
      - name: Checkout the jsonassert engines as modules/jsonassert
        uses: actions/checkout@v4
        with:
          repository: jsonassert/jsonassert-lang
          path: modules/jsonassert
      - name: Checkout the tour UI as modules/testframe-tour-ui
        uses: actions/checkout@v4
        with:
          repository: testframe-org/testframe-tour-ui
          path: modules/testframe-tour-ui
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: |
          (cd modules/jsonassert/modules/jsonassert-js && bun install --frozen-lockfile)
          (cd modules/testframe-tour-ui && bun install --frozen-lockfile)
          (cd modules/testframe-ide && bun install --frozen-lockfile)
      - name: Test
        working-directory: modules/testframe-ide
        run: bun test
      - name: Typecheck
        working-directory: modules/testframe-ide
        run: bun run typecheck
      - name: Build
        working-directory: modules/testframe-ide
        run: bun run build

  product-api:
    name: example product-api (Spring Boot + Mongo)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test
        working-directory: examples/product-test/examples-components/product-api
        run: ./mvnw -B -q verify

  product-web:
    name: example product-web (Vite React TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: examples/product-test/examples-components/product-web
        run: bun install --frozen-lockfile
      - name: Typecheck + build
        working-directory: examples/product-test/examples-components/product-web
        run: bun run build
